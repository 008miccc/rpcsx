```yaml
  build-android:
    name: Build Android SM8750

    env:
      NDK_VERSION: "29.0.14206865"
      CMAKE_VERSION: "3.31.6"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Ninja
        run: |
          sudo apt update
          sudo apt install -y ninja-build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: |
          yes | sdkmanager \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Configure
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          CMAKE="$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}/bin/cmake"

          "$CMAKE" \
            -B build \
            -S android \
            -G Ninja \
            -DANDROID_ABI=arm64-v8a \
            -DUSE_ARCH=armv8.6-a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_NDK="$NDK" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-mcpu=oryon-1 -mno-ls64 -O3" \
            -DCMAKE_CXX_FLAGS="-mcpu=oryon-1 -mno-ls64 -O3" \
            -DCMAKE_SHARED_LINKER_FLAGS="-flto=thin -fuse-ld=lld" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto=thin -fuse-ld=lld" \
            -DUSE_LTO=ON

      - name: Verify compiler target
        shell: bash
        run: |
          grep -R -- "-mcpu=oryon-1" build/compile_commands.json || true
          grep -R -- "-mno-ls64" build/compile_commands.json || true

          if grep -R -- "-march=armv8.1-a" build/compile_commands.json; then
            echo "ERROR: armv8.1-a detected"
            exit 1
          fi

          if grep -R -- "-march=armv9" build/compile_commands.json; then
            echo "ERROR: armv9 detected"
            exit 1
          fi

          echo "Configured exclusively for SM8750/Oryon."

      - name: Build
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}/bin/cmake" \
            --build build \
            --parallel

      - name: Strip
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            build/librpcsx-android.so

      - name: Rename artifact
        run: |
          mv \
            build/librpcsx-android.so \
            librpcsx-android-arm64-v8.6a-oryon.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rpcsx-sm8750
          path: librpcsx-android-arm64-v8.6a-oryon.so
          if-no-files-found: error
          compression-level: 0
```
